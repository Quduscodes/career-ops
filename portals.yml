# Portal Scanner Configuration — Flutter/Mobile Developer
# Customized for Qudus Fatungase, Flutter/Mobile Developer, Lagos Nigeria
# Created: 2026-10-01

title_filter:
  positive:
    # Flutter & Dart
    - "Flutter"
    - "Dart"
    # Mobile Engineering
    - "Mobile Developer"
    - "Mobile Engineer"
    - "Mobile Software Engineer"
    - "Mobile App Developer"
    - "Mobile App Engineer"
    - "App Developer"
    # Cross-platform
    - "Cross-platform"
    - "Cross Platform"
    # Android / iOS (hybrid roles often need Flutter devs)
    - "Android Developer"
    - "Android Engineer"
    - "iOS Developer"
    - "iOS Engineer"
    # React Native (adjacent, sometimes dual-listed)
    - "React Native"
    # Senior titles
    - "Senior Mobile"
    - "Lead Mobile"
    - "Staff Mobile"
    - "Principal Mobile"
    # Remote-friendly general
    - "Software Engineer"
    - "Frontend Engineer"
    - "Full Stack Mobile"
  negative:
    - "Intern"
    - "Junior"
    - "Data Scientist"
    - "Machine Learning Engineer"
    - "DevOps"
    - "Backend"
    - "SRE"
    - "Site Reliability"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "COBOL"
    - "PHP"
    - "Ruby on Rails"
    - "Salesforce"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head of"

# -- Search queries --
search_queries:
  # -- Flutter specific --
  - name: Greenhouse — Flutter Developer
    query: 'site:job-boards.greenhouse.io "Flutter" developer OR engineer remote'
    enabled: true

  - name: Ashby — Flutter Developer
    query: 'site:jobs.ashbyhq.com "Flutter" developer OR engineer remote'
    enabled: true

  - name: Lever — Flutter Developer
    query: 'site:jobs.lever.co "Flutter" developer OR engineer remote'
    enabled: true

  - name: Workable — Flutter Developer
    query: 'site:apply.workable.com "Flutter" developer OR engineer remote'
    enabled: true

  # -- Mobile Engineering --
  - name: Greenhouse — Mobile Engineer
    query: 'site:job-boards.greenhouse.io "Mobile Engineer" OR "Mobile Developer" Flutter OR Dart remote'
    enabled: true

  - name: Ashby — Mobile Engineer
    query: 'site:jobs.ashbyhq.com "Mobile Engineer" OR "Mobile Developer" Flutter OR Dart remote'
    enabled: true

  - name: Lever — Mobile Engineer
    query: 'site:jobs.lever.co "Mobile Engineer" OR "Mobile Developer" Flutter OR Dart remote'
    enabled: true

  # -- Cross-platform (Flutter, React Native) --
  - name: Cross-platform — All portals
    query: '"Flutter" OR "React Native" "Mobile Engineer" OR "Mobile Developer" remote senior'
    enabled: true

  # -- African tech companies (Lagos/Nigeria/Africa focus) --
  - name: African Tech — Flutter/Mobile
    query: '"Flutter" OR "Mobile Developer" Nigeria OR Lagos OR Africa OR "remote Africa" engineer 2026'
    enabled: true

  - name: Wellfound — Flutter Mobile
    query: 'site:wellfound.com "Flutter" OR "Mobile Engineer" remote'
    enabled: true

  # -- General Flutter market --
  - name: Flutter Jobs — Global Remote
    query: '"Flutter developer" OR "Flutter engineer" remote 2026 senior'
    enabled: true

  - name: Flutter Jobs — Indeed/LinkedIn
    query: '"Flutter" "Mobile Engineer" OR "Mobile Developer" remote senior -intern'
    enabled: true

